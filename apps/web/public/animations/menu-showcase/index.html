<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Menu showcase</title>
    <style>
      :root {
        color-scheme: light;
        --veli-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --veli-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --veli-color-bg-surface-base: #efefef;
        --veli-color-bg-surface-raised: #ffffff;
        --veli-color-menu-bg: #ffffff;
        --veli-color-menu-hover: rgb(17 32 0 / 0.05);
        --veli-color-menu-pressed: rgb(17 32 0 / 0.07);
        --veli-color-border-base-subtle: rgb(17 32 0 / 0.13);
        --veli-color-border-focus: #008f8d;
        --veli-color-text-base-strong: #353633;
        --veli-color-text-base-inverted: #fbfcfb;
        --veli-color-icon-base-muted: #50514d;
        --veli-color-text-danger-muted: #d5110e;
        --veli-color-status-info-emphasis: #0782cf;
        --veli-color-status-indigo-emphasis: #7950d8;
        --veli-color-effects-shadow-depth-100: rgb(0 0 0 / 0.08);
        --veli-color-effects-shadow-frame: rgb(0 0 0 / 0.05);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--veli-color-bg-surface-base);
        font-family: Inter, Arial, sans-serif;
      }
      .viewport {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--veli-color-bg-surface-base);
        position: relative;
      }
      .canvas {
        width: 1920px;
        height: 1080px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: center;
        background: var(--veli-color-bg-surface-base);
        overflow: hidden;
      }
      /* The panel itself (x=12..238, y=6..274) is centered at 960,540. */
      .camera {
        position: absolute;
        left: 710px;
        top: 260px;
        width: 500px;
        height: 584px;
        transform-origin: 250px 280px;
      }
      .component {
        position: absolute;
        inset: 0;
        transform-origin: 24px 12px;
      }
      .source {
        width: 500px;
        height: 584px;
      }
      .source > svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .source [fill='white'] {
        fill: var(--veli-color-menu-bg);
      }
      .source [fill='#50514D'] {
        fill: var(--veli-color-icon-base-muted);
      }
      .source [fill='#353633'] {
        fill: var(--veli-color-text-base-strong);
      }
      .source [fill='#D5110E'] {
        fill: var(--veli-color-text-danger-muted);
      }
      .source [stroke='#112000'] {
        stroke: var(--veli-color-border-base-subtle);
        stroke-opacity: 1;
      }
      .spec {
        position: absolute;
        left: 0;
        top: 0;
        width: 500px;
        height: 584px;
        overflow: visible;
        pointer-events: none;
      }
      .spec .ink {
        stroke: var(--veli-color-status-info-emphasis);
        stroke-width: 0.65;
        fill: none;
      }
      .spec .guide {
        stroke: var(--veli-color-status-info-emphasis);
        stroke-width: 0.5;
        stroke-dasharray: 2 2;
        opacity: 0.65;
      }
      .spec text {
        font-family: Arial, sans-serif;
        font-size: 7px;
        fill: var(--veli-color-text-base-inverted);
        text-anchor: middle;
        dominant-baseline: central;
      }
      .spec .tag {
        fill: var(--veli-color-status-info-emphasis);
      }
      .spec .note {
        fill: var(--veli-color-status-info-emphasis);
        font-size: 7px;
      }
      .spec .measure {
        opacity: 0;
      }
      .spec .radius-inner {
        stroke: var(--veli-color-status-indigo-emphasis);
      }
      .spec .radius-label {
        font-size: 7.5px;
      }
      .spec .radius-tag {
        fill: var(--veli-color-status-indigo-emphasis);
      }
      .spec .ink {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .spec [stroke='#0796ee'] {
        stroke: var(--veli-color-status-info-emphasis);
      }
      .spec [fill='#0796ee'] {
        fill: var(--veli-color-status-info-emphasis);
      }
      .hover-fill {
        fill: var(--veli-color-menu-hover);
        opacity: 0;
      }
      .controls {
        position: absolute;
        z-index: 2;
        right: 16px;
        bottom: 16px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      button {
        font:
          13px Arial,
          sans-serif;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid var(--veli-color-border-base-subtle);
        border-radius: 7px;
        background: var(--veli-color-bg-surface-raised);
        color: var(--veli-color-text-base-strong);
        cursor: pointer;
        box-shadow:
          0 2px 8px var(--veli-color-effects-shadow-depth-100),
          0 0 1px var(--veli-color-effects-shadow-frame);
      }
      button[aria-pressed='true'] {
        background: var(--veli-color-menu-pressed);
        color: var(--veli-color-text-base-strong);
        border-color: var(--veli-color-border-base-subtle);
      }
      button:focus-visible {
        outline: 2px solid var(--veli-color-border-focus);
        outline-offset: 3px;
      }
      button:active {
        transform: scale(0.97);
      }
      @media (hover: hover) and (pointer: fine) {
        button:hover {
          background: var(--veli-color-menu-hover);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button:active {
          transform: none;
        }
      }
    </style>
  </head>

    <script>
      const $ = (s) => document.querySelector(s),
        viewport = $('.viewport'),
        canvas = $('.canvas'),
        camera = $('.camera'),
        component = $('.component');
      const rows = [...document.querySelectorAll('.source>svg>g>g')],
        specs = [...document.querySelectorAll('.measure')];
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      const computedStyles = getComputedStyle(document.documentElement),
        out = computedStyles.getPropertyValue('--veli-ease-out').trim(),
        move = computedStyles.getPropertyValue('--veli-ease-in-out').trim();
      const themeTokenNames = [
        '--veli-color-bg-surface-base',
        '--veli-color-bg-surface-raised',
        '--veli-color-menu-bg',
        '--veli-color-menu-hover',
        '--veli-color-menu-pressed',
        '--veli-color-border-base-subtle',
        '--veli-color-border-focus',
        '--veli-color-text-base-strong',
        '--veli-color-text-base-inverted',
        '--veli-color-icon-base-muted',
        '--veli-color-text-danger-muted',
        '--veli-color-status-info-emphasis',
        '--veli-color-status-indigo-emphasis',
        '--veli-color-effects-shadow-depth-100',
        '--veli-color-effects-shadow-frame',
      ];
      window.addEventListener('message', (event) => {
        const message = event.data;
        if (message?.type !== 'veli:animation-theme') return;

        const theme = message.theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        for (const tokenName of themeTokenNames) {
          const value = message.tokens?.[tokenName];
          if (typeof value === 'string' && value.trim()) {
            document.documentElement.style.setProperty(tokenName, value);
          }
        }
      });
      window.parent.postMessage({ type: 'veli:animation-ready' }, '*');
      const ns = 'http://www.w3.org/2000/svg';
      // Additional hover state; every original SVG path and definition stays untouched.
      const hover = document.createElementNS(ns, 'rect');
      Object.entries({
        x: 16,
        y: 10,
        width: 218,
        height: 52,
        rx: 8,
        fill: 'var(--veli-color-menu-hover)',
        class: 'hover-fill',
      }).forEach(([k, v]) => hover.setAttribute(k, v));
      rows[0].before(hover);

      // Splitting independent moveto segments preserves the exact line geometry.
      specs.forEach((group) =>
        group.querySelectorAll('path.ink,path.guide').forEach((path) => {
          const parts = path.getAttribute('d').match(/M[^M]*/g);
          if (parts.length < 2) return;
          parts.forEach((d) => {
            const part = path.cloneNode();
            part.setAttribute('d', d);
            path.before(part);
          });
          path.remove();
        }),

      let animations = [],
        timer,
        loop = false,
        finished = false;
      function fit() {
        const scale = Math.min(viewport.clientWidth / 1920, viewport.clientHeight / 1080);
        canvas.style.transform = `translate(-50%,-50%) scale(${scale})`;
      }
      new ResizeObserver(fit).observe(viewport);
      fit();
      function animate(el, frames, delay, duration, easing = out, fill = 'both') {
        const a = el.animate(frames, { delay, duration, easing, fill });
        animations.push(a);
        return a;
      }
      function draw(group, gentle) {
        const at = Number(group.dataset.at);
        animate(group, [{ opacity: 0 }, { opacity: 1 }], at, 160);
        const strokes = [...group.querySelectorAll('.ink,.guide')];
        strokes.forEach((stroke, i) => {
          const b = stroke.getBBox();
          // Each stroke has its own reveal box; vertical dimensions draw downward.
          const from = b.height > b.width ? 'inset(0 -4px 100% -4px)' : 'inset(-4px 100% -4px 0)';
          animate(
            stroke,
            gentle
              ? [{ opacity: 0 }, { opacity: 1 }]
              : [
                  { opacity: 0, clipPath: from },
                  { opacity: 1, clipPath: 'inset(-4px -4px -4px -4px)' },
                ],
            at + i * 30,
            gentle ? 180 : 500,

        group
          .querySelectorAll('text,.tag,circle')
          .forEach((el) =>
            animate(
              el,
              [{ opacity: 0 }, { opacity: 1 }],
              at + (gentle ? 180 : 500 + Math.max(0, strokes.length - 1) * 30),
              200,
            ),
          );
        group
          .querySelectorAll('[fill="url(#spec-hatch)"]')
          .forEach((el) => animate(el, [{ opacity: 0 }, { opacity: 1 }], at + 180, 400));

        clearTimeout(timer);
        animations.forEach((a) => a.cancel());
        animations = [];
        finished = false;
        const gentle = reduced.matches;

          0,
          gentle ? 200 : 480,

        rows.forEach((row, i) =>

            gentle

              : [

                  { opacity: 1, transform: 'translateY(0px)' },

            60 + i * 50,
            gentle ? 180 : 420,

        animate(hover, [{ opacity: 0 }, { opacity: 1 }], 830, 200, 'ease');
        animate(
          camera,
          gentle
            ? [{ transform: 'scale(1.2)' }, { transform: 'scale(1.2)' }]
            : [{ transform: 'scale(1)' }, { transform: 'scale(1.2)' }],
          1400,
          420,
          move,
        );
        specs.forEach((el) => draw(el, gentle));
        timer = setTimeout(() => {
          finished = true;
          if (loop) play();
        }, 9700);
      }

      $('#loop').addEventListener('click', () => {
        loop = !loop;
        $('#loop').setAttribute('aria-pressed', String(loop));
        $('#loop').textContent = `Loop: ${loop ? 'On' : 'Off'}`;
        if (loop && finished) play();
