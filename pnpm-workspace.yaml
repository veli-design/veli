packages:
  - 'apps/*'
  - 'packages/*'
  - 'playground/*'

overrides:
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  '@internationalized/date': ^3.12.2
  'hono@^4': ^4.12.32
  'immutable@^5': ^5.1.9
  vite: 6.4.3
  '@types/node': ^24.10.1
  jiti: 2.7.0
  lightningcss: 1.32.0

# Reject transitive dependencies that resolve outside the configured registries.
blockExoticSubdeps: true

# Wait 24 hours before resolving newly published package versions.
minimumReleaseAge: 1440

# CI and hooks install dependencies explicitly; avoid pnpm 11's implicit,
# bare-pnpm install before `run` and `exec` in non-interactive environments.
verifyDepsBeforeRun: false

# pnpm 11 requires explicit approval for dependency build scripts. These packages
# already ran their install scripts under pnpm 10 and are required by Veli tooling.
strictDepBuilds: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  workerd: true
