name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
            const title = process.env.PR_TITLE ?? "";
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+$/;

            if (!pattern.test(title)) {
              console.error(`Invalid PR title: "${title}"`);
              console.error("");
              console.error("Use Conventional Commits format so squash commits on main stay clean.");
              console.error("Examples:");
              console.error("  feat(ui): add segmented control");
              console.error("  fix(tokens): normalize OKLCH output");
              console.error("  docs: document release workflow");
              console.error("  chore: release packages");
              process.exit(1);
            }
          '
