name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Changesets
        run: pnpm changeset:check

      - name: Test Changeset Tooling
        run: pnpm test:changesets

      - name: Check Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build Packages
        run: pnpm build
