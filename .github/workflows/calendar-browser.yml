name: Calendar browser regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/ui/src/calendar*'
      - 'apps/storybook/src/stories/calendar.stories.tsx'
      - 'apps/web/src/components/CalendarExamples.tsx'
      - 'apps/web/src/content/docs/calendar.mdx'
      - 'apps/web/src/styles/global.css'
      - 'apps/web/src/lib/docs-preview-examples.mjs'
      - 'scripts/verify-calendar*.mjs'
      - '.github/workflows/calendar-browser.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: calendar-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  calendar-browser:
    name: Calendar / Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/consumer-setup
      - name: Build library and production sites
        run: corepack pnpm build
      - name: Prepare isolated browser runtime
        run: |
          node scripts/prepare-playground-browser.mjs "$RUNNER_TEMP/calendar-browser"
          corepack pnpm --dir "$RUNNER_TEMP/calendar-browser" exec playwright install --with-deps webkit
          corepack pnpm --dir "$RUNNER_TEMP/calendar-browser" add -D @axe-core/playwright@4.11.1
      - name: Verify Calendar, RangeCalendar and production documentation
        run: |
          python3 -m http.server 6029 --bind 127.0.0.1 --directory apps/storybook/storybook-static > "$RUNNER_TEMP/calendar-storybook.log" 2>&1 &
          STORYBOOK_PID=$!
          python3 -m http.server 4329 --bind 127.0.0.1 --directory apps/web/dist > "$RUNNER_TEMP/calendar-docs.log" 2>&1 &
          DOCS_PID=$!
          trap 'kill "$STORYBOOK_PID" "$DOCS_PID"' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:6029/index.json > /dev/null
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4329/docs/calendar/ > /dev/null
          node scripts/verify-calendar.mjs "$RUNNER_TEMP/calendar-browser" http://127.0.0.1:6029 "$RUNNER_TEMP/calendar-evidence"
          node scripts/verify-calendar-docs.mjs "$RUNNER_TEMP/calendar-browser" http://127.0.0.1:4329/docs/calendar/ "$RUNNER_TEMP/calendar-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-browser-evidence
          path: |
            ${{ runner.temp }}/calendar-evidence
            ${{ runner.temp }}/calendar-storybook.log
            ${{ runner.temp }}/calendar-docs.log
          if-no-files-found: ignore
          retention-days: 14
