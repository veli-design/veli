name: Release

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: Separately approved npm dist-tag
        required: true
        type: string
      reviewed-commit:
        description: Full merged release commit reviewed and validated for publication
        required: true
        type: string
      visual-review-approved:
        description: Confirm human review of the exact candidate and its visual evidence
        required: true
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: vars.VELI_NPM_PUBLICATION_APPROVED == 'true' && vars.VELI_RELEASE_BRANCH != '' && github.ref_name == vars.VELI_RELEASE_BRANCH
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js for release planning
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select release preparation or publication
        id: plan
        run: node scripts/release-ci.mjs plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED_COMMIT: ${{ inputs.reviewed-commit }}
          VISUAL_REVIEW_APPROVED: ${{ inputs.visual-review-approved }}

      - name: Require completed npm bootstrap and trusted publishers
        if: steps.plan.outputs.mode == 'publish'
        run: test "$TRUSTED_PUBLISHING_READY" = 'true'
        env:
          TRUSTED_PUBLISHING_READY: ${{ vars.VELI_NPM_TRUSTED_PUBLISHING_READY }}

      - name: Verify approved validation of the actual merged release tree
        if: steps.plan.outputs.mode == 'publish'
        run: node scripts/release-ci.mjs verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: steps.plan.outputs.mode != 'none'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.plan.outputs.mode != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@veli-design'

      - name: Install Dependencies
        if: steps.plan.outputs.mode != 'none'
        run: corepack pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        if: steps.plan.outputs.mode != 'none'
        id: changesets
        uses: changesets/action@v1
        with:
          version: corepack pnpm version-packages
          publish: ${{ steps.plan.outputs.mode == 'publish' && 'corepack pnpm release' || '' }}
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private source repository cannot generate npm provenance.
          NPM_CONFIG_PROVENANCE: false
          VELI_NPM_PUBLICATION_APPROVED: ${{ vars.VELI_NPM_PUBLICATION_APPROVED }}
          VELI_NPM_DIST_TAG: ${{ inputs.dist-tag }}

      - name: Record published release snapshot
        if: steps.changesets.outputs.published == 'true'
        run: |
          node scripts/release-sites.mjs manifest "$RUNNER_TEMP/published-versions.json"
          node scripts/published-packages.mjs record "$RUNNER_TEMP/published-versions.json" "$RUNNER_TEMP/publication"

      - uses: actions/upload-artifact@v4
        if: steps.changesets.outputs.published == 'true'
        with:
          name: release-manifest
          path: ${{ runner.temp }}/publication
          retention-days: 90

      - name: Retain snapshot with the published release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        with:
          script: |
            const fs = require('node:fs');
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES);
            const { name, version } = published[0];
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: `${name}@${version}` });
            for (const name of ['release-manifest.json', 'publication.json']) {
              await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name, data: fs.readFileSync(`${process.env.RUNNER_TEMP}/publication/${name}`) });
            }

  deploy-sites:
    needs: release
    if: needs.release.outputs.published == 'true' && vars.VELI_REGISTRY_TRANSITION_APPROVED == 'true'
    permissions:
      contents: read
      packages: read
      actions: read
    uses: ./.github/workflows/deploy-release-sites.yml
    with:
      source-ref: ${{ github.sha }}
      manifest-run-id: ${{ github.run_id }}
    secrets: inherit
