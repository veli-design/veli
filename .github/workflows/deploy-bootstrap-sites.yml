name: Temporary bootstrap site catch-up
# Remove this catch-up workflow after both sites and the current catalog are verified live.
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact reviewed bootstrap release commit
        required: true
        default: c36ca062456bbaeddb2a45a48954ebaaec637c1b
        type: string
      deploy-sites:
        description: Deploy the verified Web, Storybook and current internal Blocks catalog
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency: veli-public-release-sites
jobs:
  bootstrap:
    if: github.repository == 'tradenetcorp/veli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact source and anonymously download approved npm artifacts
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: node scripts/verify-bootstrap-release.mjs "$SOURCE_REF" "$GITHUB_WORKSPACE/release-source" "$RUNNER_TEMP/bootstrap-release"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: release-source/package.json
      - name: Install locked validation tools
        run: corepack pnpm --dir release-source install --frozen-lockfile
      - name: Verify strict installed packages and all copied Blocks
        run: node release-source/scripts/check-npm-migration.mjs "$RUNNER_TEMP/bootstrap-consumer" "$RUNNER_TEMP/bootstrap-release"
      - name: Stage sites against the verified public tarballs
        env:
          VELI_TARBALLS: '{"@veli-design/react":"${{ runner.temp }}/bootstrap-release/ui.tgz","@veli-design/tokens":"${{ runner.temp }}/bootstrap-release/tokens.tgz"}'
        run: node release-source/scripts/release-sites.mjs stage "$RUNNER_TEMP/veli-release-sites" "$RUNNER_TEMP/bootstrap-release/release-manifest.json"
      - name: Build packaged Web and Storybook
        run: node release-source/scripts/release-sites.mjs build "$RUNNER_TEMP/veli-release-sites"
      - name: Retain verified release snapshot and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-bootstrap-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bootstrap-release
          retention-days: 90
          if-no-files-found: error
      - name: Require explicit internal deployment approval
        if: inputs.deploy-sites
        env:
          REGISTRY_TRANSITION_APPROVED: ${{ vars.VELI_REGISTRY_TRANSITION_APPROVED }}
        run: test "$REGISTRY_TRANSITION_APPROVED" = 'true'
      - name: Deploy web docs and current internal catalog
        if: inputs.deploy-sites
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}/veli-release-sites/apps/web
          environment: production
          command: deploy
      - name: Deploy Storybook
        if: inputs.deploy-sites
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}/veli-release-sites/apps/storybook
          environment: production
          command: deploy
